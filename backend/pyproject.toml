[project]
name = "hypoweaver"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "openai>=1.60,<3",
    "pymupdf>=1.25,<2",
    "python-multipart>=0.0.20,<1",
    "pandas>=3.0.6",
    "pyreadstat>=1.3.6",
    "openpyxl>=3.1.5",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "linearmodels>=7.0",
]
[dependency-groups]
dev = ["pytest>=8,<9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
