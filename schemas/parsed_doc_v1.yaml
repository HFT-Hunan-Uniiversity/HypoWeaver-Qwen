# ============================================================================
# ParsedDoc IR 顶层 schema
# ============================================================================
parsed_doc_schema:

  meta:
    type: object
    fields:
      doc_type:
        type: string
        enum: [学术论文, 政策文件, ESG报告/年报, 公开数据库条目, 行业资讯/研报/新闻]
      title: string
      authors: [string]
      year: int
      source_loc:
        type: string
        description: 原始 PDF/HTML 文件路径,可反推回原文件
      clean_log:
        type: array
        items:
          ts: ISO8601
          operation: string
          affected: string          # 影响的章节/位置/字符数
          status: ok | needs_human_review
          error_type: string|null   # ocr_garbled | table_misaligned | scan_quality_low | format_unknown
      normalized_values:
        type: array
        description: 数值标准化结果,原文不改动,下游按需取
        items:
          original: string
          normalized: string|num
          unit: string
          context: string
      extra_info:
        type: object
        description: doc_type 专属元数据,见 doc_type_specific 节

  blocks:
    type: array
    description: 分层段落列表
    item:
      type: string              # heading | paragraph | list_item | caption
      level: int|null           # 标题层级(1-4),非标题为 null
      text: string
      page: int
      bbox: [int, int, int, int]|null
      keep: bool                # false 表示被清洗规则过滤掉的块(不进下游)

  tables:
    type: array
    description: 含数据的表格
    item:
      table_id: string
      caption: string|null
      header: [string]
      rows: [[string]]
      page: int
      context_before: string|null
      source_loc: string
      quality: ok | needs_human_review

  figures:
    type: array
    description: 纯图(不含数据表)与图示
    item:
      figure_id: string
      image_path: string
      caption: string|null
      page: int
      ref_text: string|null      # 正文里引用它的文字
      vl_description: string|null # 多模态描述,后填

  references:
    type: array
    description: 参考文献(仅 paper 类型填,其它类型为空数组)
    item:
      ref_id: string
      raw: string                # 原始引用文本
      parsed:
        authors: [string]|null
        year: int|null
        title: string|null
        venue: string|null
        doi: string|null

# ============================================================================
# 通用清洗前置规则(所有文档强制执行)
# ============================================================================
preprocessing_rules:
  execution_order:
    - 1_duplicate_detection   # 重复内容检测(为后续页眉判断准备)
    - 2_header_footer         # 页眉页脚删除
    - 3_special_chars         # 特殊字符清洗
    - 4_paragraph_merge       # 段落合并(此时页眉已干净)
    - 5_number_standardize    # 数值标准化(不覆盖原文,记录到 meta)
    - 6_marker_cleanup        # 冗余标记清理
    - 7_quality_check         # 异常检测,标记 needs_human_review

  rules:

    header_footer_removal:
      description: |
        基于位置(顶部/底部固定区域)+ 重复次数判断页眉页脚,
        不基于内容(避免误伤正文里出现的期刊名/单位名)
      algorithm:
        - 扫描每页 top 15% / bottom 15% 区域文字
        - 连续 ≥ 3 页重复出现的固定文字 → 标记为页眉/页脚
        - 全文删除该文字
        - 单独再检测"第 X 页"、"X / Y"、"X" 单独数字 → 删页码
        - 检测版权/官网/二维码/邮箱/电话 → 删
      output_to_log: "删除页眉页脚:N 处"

    paragraph_merging:
      description: 段落重建
      algorithm:
        - 单纯换行 / 软换行 / 段中空格连续出现 → 拼接为完整段落
        - 一级 / 二级标题作为硬分段边界(不与上文合并)
        - 标题识别失败时兜底:行长度 < 60 字 + 无句末标点 + 下一行为空 → 视为段落延续
        - 标题识别 fallback 正则:
            一级: "^第[一二三四五六七八九十百零]+[章节部分]"
            二级: "^[（(][一二三四五六七八九十]+[）)]"
            三级: "^\\d+\\."
            四级: "^[（(]\\d+[）)]"
      output_to_log: "段落合并:N 处"

    special_char_normalization:
      description: 特殊字符统一
      algorithm:
        - 全角空格 → 半角空格
        - 多余空行(连续 ≥ 2) → 单空行
        - 连续制表符 / 多余空格 → 单空格
        - 分割线 (---/===/*** 等连续符号) → 删除
        - 标点统一:中文用全角(，。！？：；),数字 / 公式上下文用半角(, . : ;)
        - 不动 LaTeX 公式与数学符号
      output_to_log: "特殊字符清洗:N 处"

    number_standardization:
      description: |
        数值标准化(关键规则)。
        原则:原文不改动,标准化结果存到 meta.normalized_values[]
      algorithm:
        - 千分逗号删除: "12,680" → normalized: 12680, original: "12,680"
        - 中文单位数字换算: "1.2 亿" → 120000000, "5 千万" → 50000000, "3.5 万" → 35000
        - 货币与百分比保留原文: "约 1.2 亿美元" 不强转(语境歧义),只标 unit: "美元(原文)"
        - 碳排放单位统一标注(保留原文,标注 standard_unit):
            "吨二氧化碳当量"、"tCO2e"、"吨 CO₂e"、"万吨 CO₂e" → standard_unit: "吨二氧化碳当量"
            数字按上下文换算成吨: "1.2 万吨 CO₂e" → 12000 吨二氧化碳当量
        - 写入 meta.normalized_values[],不覆盖原文
      output_to_log: "数值标准化:N 处"

    redundant_marker_cleanup:
      description: 冗余标记清理
      algorithm:
        - 引用上标 [1][2] → 删除括号标记,保留数字(下游 C 自行处理引用关系)
        - 文档内跳转链接(锚点 #xxx) → 删除
        - 网址(http(s)://...) → 删除
        - 联系方式(邮箱 / 电话 / 微信 / QQ) → 删除
        - PDF 自带标注、批注、高亮备注 → 删除
      output_to_log: "冗余标记清理:N 处"

    quality_check:
      description: 异常检测,触发人工复核
      algorithm:
        - OCR 扫描件检测:图像占位符密度 > 阈值 且 文字提取长度异常短 → 标记 ocr_garbled
        - 表格错位:tables 字段中 rows 长度方差 > 阈值 → 标记 table_misaligned
        - 扫描质量低:图像模糊导致 OCR 置信度 < 0.6 占比 > 30% → 标记 scan_quality_low
        - 版式未识别:blocks 中 paragraph 占比异常高(> 90%) 且 无 heading → 标记 format_unknown
      output_to_log: "异常标记:N 处,详情见 meta.status / error_type"

# ============================================================================
# doc_type 专属清洗规范
# ============================================================================
doc_type_specific:

  paper:
    extra_info_fields: [doi, journal, keywords, fund_project, sample_period, sample_size]
    delete:
      - 首页封面 / 投稿信息 / 基金项目 / 作者简介 / 邮箱 / 作者单位地址
      - 参考文献整段(但存到 ParsedDoc.references[],不丢)
      - 图表下方重复数据注释 / 重复变量说明
    keep_and_format:
      - 摘要 / 引言 / 理论机制 / 研究假设 / 实证 / 异质性 / 结论 → blocks,标题分层
      - 回归表格 → tables,系数、显著性符号 ***/ **/ * 原样保留
      - H1/H2/H3 假设文本完整保留,不删减
      - 公式文字描述保留;纯图片公式仅记录 figures.caption
    references_handling:
      description: 不删除,提取后独立存到 ParsedDoc.references[]
      algorithm:
        - GROBID 抽 TEI 取出参考文献列表
        - 每条 ref 写 references[].raw 与 parsed 字段
        - blocks 中不渲染参考文献段(标记 keep: false)
    clean_log_examples:
      - "移除首页作者基金信息"
      - "删除文末参考文献列表(转存到 references[])"
      - "统一回归显著性标记格式"
      - "合并正文分段换行"

  policy:
    extra_info_fields: [policy_no, issuer, effective_date, attachment_list]
    delete:
      - 文件左上角文号水印 / 页码 / 印发日期重复抬头
      - 附件说明 / 填报表格空白模板 / 联系人 / 咨询电话
      - 重复抄送机关 / 落款单位重复文字
    keep_and_format:
      - 政策文号 → meta.extra_info.policy_no
      - 发文机构 → meta.extra_info.issuer
      - 政策实施期限 → meta.extra_info.effective_date
      - 一、二、三级政策条款完整保留 heading,严格区分层级
      - 约束标准 / 资金工具 / 试点范围文本完整留存
      - 政策配套量化指标表格 → tables
    heading_recognition_extra:
      一级: ["一、", "二、", "三、", "四、", "五、", "六、"]
      二级: ["（一）", "（二）", "（三）"]
      三级: ["1.", "2.", "3."]
      四级: ["（1）", "（2）"]
    clean_log_examples:
      - "去除每页重复发文抬头"
      - "删除附件填报模板"
      - "清理文末抄送名单"
      - "统一政策条款层级标题"

  esg_report:
    extra_info_fields: [company, report_year, reporting_standard]
    delete:
      - 开篇董事长致辞重复标语 / 企业宣传口号 / 品牌介绍
      - 财务报表附注无关文字 / 股票交易信息 / 股东名单
      - 图片底部装饰性标语 / 环保宣传空话
    keep_and_format:
      - 企业名称 → meta.extra_info.company
      - 报告年份 → meta.extra_info.report_year
      - 遵循指引 → meta.extra_info.reporting_standard
      - 碳排放 / 能耗 / 环保投入 / 绿色专利表格 → tables(完整提取)
      - Scope1/2/3 排放 / 减排目标 / 绿色项目投资数据完整保留
      - 环境 / 社会责任 / 治理板块 → blocks,heading 分层
      - 趋势图表(图):纯图 → figures,含数据 → tables,语义模糊时优先 tables
    clean_log_examples:
      - "剔除企业宣传标语"
      - "提取碳排放数据表"
      - "统一能源消耗数值单位"
      - "清理年报股东无关信息"

  news:
    extra_info_fields: [source, publish_date, author, url_original]
    delete:
      - 资讯来源水印 / 记者署名 / 发布时间重复标注
      - 文末广告 / 往期推荐 / 阅读量 / 互动评论
      - 行情短期波动无关闲聊文字
    keep_and_format:
      - 核心政策解读 / 行业绿色金融动态 / 机构观点完整保留
      - 研报中的行业规模 / 预测数据表格 → tables
      - 碎片化短句(< 80 字 + 句末无句号 + 与前段同主题)合并为通顺完整段落
    clean_log_examples:
      - "移除资讯记者署名与来源水印"
      - "删除文末广告推荐"
      - "合并碎片化行情短句"

  database:
    description: 公开数据库条目,本身已结构化,不走 OCR/解析
    extra_info_fields: [db_name, table_name, row_id, fields]
    delete: []
    keep_and_format:
      - 直接走表格入库路径,不入 ParsedDoc IR
      - 若混有非结构化描述(备注、注释)→ 进 ParsedDoc.blocks,doc_type=database
    clean_log_examples: []

# ============================================================================
# 输出约束(对接 ParsedDoc)
# ============================================================================
output_constraints:

  structure:
    - 所有清洗后的文本分层存入 blocks / tables / figures,不产生纯无结构大文本
    - 段落 / 表格 / 图严格分离,不做"含表格的段落"
    - heading 严格标记 type + level,正文进 paragraphs

  source_protection:
    - 原始 PDF / HTML 文件不修改,清洗仅作用于输出的 ParsedDoc JSON
    - source_loc 字段必须能反推回原始文件路径

  anomaly_handling:
    - 异常(OCR 乱码 / 表格错位 / 扫描质量低)写入 meta.clean_log,status=needs_human_review
    - 同时写入 meta.status,error_type 字段供下游 C 模块过滤

  boundary_with_C_module:
    - 不新增任何分类标签(theme / function)
    - 清洗只处理排版、数字、冗余文字
    - 语义分类由 C 模块(基于 classification_v2.yaml)负责

# ============================================================================
# 与下游模块的接口
# ============================================================================
downstream_interface:

  C_module:
    input: cleaned/<doc_id>.json (ParsedDoc)
    consumes: blocks (按结构切分后做 chunk + 分类)、tables、figures.references
    not_consume: meta.clean_log(C 自行做自己的异常检查)

  D_module:
    input: cleaned/<doc_id>.json + C 的 chunks
    consumes: references[] (论文间关系)、meta.extra_info.paper.authors / year

  E_module:
    input: D 的检索结果 + 空白库
    consumes: meta.normalized_values(假设可行性判断时的数据查找)