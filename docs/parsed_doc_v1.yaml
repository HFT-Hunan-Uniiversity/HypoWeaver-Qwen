version: 1
updated_at: 2026-07-19
revision_note: |
  v1 修订:
    - doc_type 编码统一英文 key + doc_type_cn 中文展示名
    - preprocessing_rules 开头加执行顺序说明
    - normalized_values 字段规则细化(正文+表格、location 字段)
    - 异常处理统一收敛到 meta.global_review_flag,四类异常细化
    - 补充 schema 强制校验
    - 精简冗余表述,统一 boundary_with_C_module
    - database 类型边界强化(跳过完整 PDF 解析)
    - news 暂不做,待组员商议

# ============================================================================
# ParsedDoc IR 顶层 schema
# ============================================================================
parsed_doc_schema:

  meta:
    type: object
    fields:

      doc_type:
        type: string
        enum: [paper, policy, esg_report, database, news]
        description: 底层枚举,英文 key,代码读写用

      doc_type_cn:
        type: string
        enum: [学术论文, 政策文件, ESG报告/年报, 公开数据库条目, 行业资讯/研报/新闻]
        description: 中文展示名,人工查看、报告展示用

      title: string
      authors: [string]
      year: int

      source_loc:
        type: string
        description: 原始文件路径,可反推回原文件

      global_review_flag:
        type: string
        enum: [ok, needs_human_review]
        description: |
          全局异常标记,统一收敛所有质量告警。
          任一异常(OCR 乱码 / 表格错位 / 版式无标题 / 低清晰度扫描 / 校验失败)
          触发即置 needs_human_review。
          needs_human_review 文档自动分流,不进入 C 批量自动分类。

      clean_log:
        type: array
        description: 清洗操作与异常的明细日志(global_review_flag 的细节展开)
        items:
          ts: ISO8601
          operation: string
          affected: string
          status: ok | needs_human_review
          error_type: string|null  # ocr_garbled | table_misaligned | scan_quality_low | format_unknown | validation_failed

      normalized_values:
        type: array
        description: |
          收录正文段落与表格单元格内的全部数值。
          仅作为机器运算附属数据,blocks 与 tables 内原始文本不做任何修改。
        items:
          original: string
          normalized: string|num
          unit: string
          context: string
          location: string  # "block:<block_id>" | "table:<table_id>:<row_idx>:<col_idx>"

      extra_info:
        type: object
        description: doc_type 专属元数据,见 doc_type_specific 节

  blocks:
    type: array
    description: 分层段落列表
    item:
      type: string          # heading | paragraph | list_item | caption
      level: int|null
      text: string
      page: int
      bbox: [int, int, int, int]|null
      keep: bool            # false 表示被规则过滤但不删除(进废块池供审计)

  tables:
    type: array
    description: 含数据的表格
    item:
      table_id: string
      caption: string|null
      header: [string]
      rows: [[string]]
      page: int
      context_before: string|null
      source_loc: string
      quality:
        type: string
        enum: [ok, table_misaligned]
        description: 表格级细节,由 meta.global_review_flag 收敛

  figures:
    type: array
    description: 纯图(不含数据表)与图示
    item:
      figure_id: string
      image_path: string
      caption: string|null
      page: int
      ref_text: string|null
      vl_description: string|null

  references:
    type: array
    description: 参考文献(仅 paper 填,其它类型空数组)
    item:
      ref_id: string
      raw: string
      parsed:
        authors: [string]|null
        year: int|null
        title: string|null
        venue: string|null
        doi: string|null

# ============================================================================
# 清洗执行模型(顺序说明)
# ============================================================================
execution_model: |
  通用清洗流程(preprocessing_rules.rules)按 execution_order 串行执行,
  执行完毕后,再依据 meta.doc_type 匹配 doc_type_specific 对应分支,
  执行各类文档专属清洗逻辑(doc_type_specific.<type>.delete / keep_and_format)。
  任一步骤触发异常 → meta.global_review_flag = needs_human_review,
  原始文本完整保留,不删除不替换。

# ============================================================================
# 通用清洗前置规则(所有文档强制执行)
# ============================================================================
preprocessing_rules:

  execution_order:
    - 1_duplicate_detection
    - 2_header_footer
    - 3_special_chars
    - 4_paragraph_merge
    - 5_number_standardize
    - 6_marker_cleanup
    - 7_quality_check
    - 8_doc_type_dispatch

  rules:

    header_footer_removal:
      algorithm:
        - 扫描每页 top 15% / bottom 15% 区域文字
        - 连续 ≥ 3 页重复出现的固定文字 → 标记为页眉 / 页脚,全文删除
        - 单独检测 "第 X 页"、"X / Y"、纯数字 → 删页码
        - 版权 / 官网 / 二维码 / 邮箱 / 电话 → 删
      log: "删除页眉页脚:N 处"

    paragraph_merging:
      algorithm:
        - 单纯换行 / 软换行 / 段中空格 → 拼接
        - 一级 / 二级标题作为硬分段边界
        - 标题识别兜底正则:
            一级: "^第[一二三四五六七八九十百零]+[章节部分]"
            二级: "^[（(][一二三四五六七八九十]+[）)]"
            三级: "^\\d+\\."
            四级: "^[（(]\\d+[）)]"
        - 标题识别失败时:行长度 < 60 字 + 无句末标点 + 下一行为空 → 视为段落延续
      log: "段落合并:N 处"

    special_char_normalization:
      algorithm:
        - 全角空格 → 半角
        - 连续 ≥ 2 空行 → 单空行
        - 连续制表符 / 多余空格 → 单空格
        - 分割线 (---/===/*** 等连续符号) → 删
        - 标点统一:中文段用全角,数字 / 公式上下文用半角
        - LaTeX 公式与数学符号不动
      log: "特殊字符清洗:N 处"

    number_standardize:
      description: |
        数值标准化。原文不改动,标准化结果写入 meta.normalized_values[]。
        同时收录正文段落与表格单元格内的全部数值。
      algorithm:
        - 千分逗号删除: "12,680" → normalized: 12680
        - 中文单位换算: "1.2 亿" → 120000000, "5 千万" → 50000000, "3.5 万" → 35000
        - 货币与模糊表达: "约 1.2 亿美元" 不强转,只标 unit: "美元(原文)"
        - 碳排放单位统一标注(原文保留,standard_unit 记录):
            "吨二氧化碳当量"、"tCO2e"、"吨 CO₂e"、"万吨 CO₂e"
            → standard_unit: "吨二氧化碳当量";数字按上下文换算成吨
      log: "数值标准化:N 处"

    marker_cleanup:
      algorithm:
        - 引用上标 [1][2] → 删括号,保留数字
        - 文档内锚点跳转 / 网址 / 联系方式 → 删
        - PDF 自带标注 / 批注 / 高亮备注 → 删
      log: "冗余标记清理:N 处"

    quality_check:
      description: |
        异常检测,统一收敛到 meta.global_review_flag。
        异常仅标记,完整保留原始文本不删除。
      anomaly_types:

        ocr_garbled:
          auto_trigger: 图像占位符密度 > 阈值 且 文字提取长度异常短
          auto_action: meta.global_review_flag = needs_human_review
          manual_recovery:
            - 重新 OCR(提升扫描分辨率)
            - 人工补录关键段落到 blocks
            - 表格丢失 → clean_log 标注 "需重建"
            - 严重不可用 → 整文档标 needs_human_review,出 fallback 摘要

        table_misaligned:
          auto_trigger: tables[].rows 长度方差 > 阈值
          auto_action: 触发 table.quality = table_misaligned,meta.global_review_flag = needs_human_review
          manual_recovery:
            - 人工核对表格结构,修正 header / rows
            - 重跑 Docling 表格识别(调整参数)
            - 严重时整张表替换为 image + caption

        format_unknown:
          auto_trigger: blocks 中 paragraph 占比 > 90% 且 无 heading
          auto_action: 按 paragraph 全文兜底切分,meta.global_review_flag = needs_human_review
          manual_recovery:
            - 人工识别版式,补充 heading 标记
            - 段落合并 / 拆分修正

        scan_quality_low:
          auto_trigger: 图像模糊导致 OCR 置信度 < 0.6 占比 > 30%
          auto_action: meta.global_review_flag = needs_human_review
          manual_recovery:
            - 提升扫描分辨率(300 → 600 dpi)
            - 替换 PDF 来源(找清晰版)
            - 关键字段人工补录

# ============================================================================
# doc_type 专属清洗规范
# ============================================================================
doc_type_specific:

  paper:
    extra_info_fields: [doi, journal, keywords, fund_project, sample_period, sample_size]
    delete:
      - 首页封面 / 投稿信息 / 基金项目 / 作者简介 / 邮箱 / 作者单位地址
      - 参考文献整段(转存到 references[],不丢)
      - 图表下方重复数据注释 / 重复变量说明
    keep_and_format:
      - 摘要 / 引言 / 理论机制 / 研究假设 / 实证 / 异质性 / 结论 → blocks
      - 回归表格 → tables,系数与显著性符号 ***/ **/ * 原样保留
      - H1/H2/H3 假设文本完整保留
      - 公式文字描述保留;纯图片公式仅记 figures.caption
    references_handling:
      description: 不删除,Grobid 抽 TEI 后存 references[]
    clean_log_examples:
      - "移除首页作者基金信息"
      - "删除文末参考文献列表(转存 references[])"
      - "统一回归显著性标记格式"
      - "合并正文分段换行"

  policy:
    extra_info_fields: [policy_no, issuer, effective_date, attachment_list]
    delete:
      - 文件左上角文号水印 / 页码 / 印发日期重复抬头
      - 附件说明 / 填报表格空白模板 / 联系人 / 咨询电话
      - 重复抄送机关 / 落款单位重复文字
    keep_and_format:
      - 政策文号 / 发文机构 / 实施期限 → meta.extra_info
      - 一、二、三级政策条款完整保留 heading,严格区分层级
      - 约束标准 / 资金工具 / 试点范围文本完整留存
      - 政策配套量化指标表格 → tables
    heading_recognition_extra:
      一级: ["一、", "二、", "三、", "四、", "五、", "六、"]
      二级: ["（一）", "（二）", "（三）"]
      三级: ["1.", "2.", "3."]
      四级: ["（1）", "（2）"]
    clean_log_examples:
      - "去除每页重复发文抬头"
      - "删除附件填报模板"
      - "清理文末抄送名单"
      - "统一政策条款层级标题"

  esg_report:
    extra_info_fields: [company, report_year, reporting_standard]
    delete:
      - 开篇董事长致辞重复标语 / 企业宣传口号 / 品牌介绍
      - 财务报表附注无关文字 / 股票交易信息 / 股东名单
      - 图片底部装饰性标语 / 环保宣传空话
    keep_and_format:
      - 企业名称 / 报告年份 / 遵循指引 → meta.extra_info
      - 碳排放 / 能耗 / 环保投入 / 绿色专利表格 → tables
      - Scope1/2/3 排放 / 减排目标 / 绿色项目投资数据完整保留
      - 环境 / 社会责任 / 治理板块 → blocks,heading 分层
      - 趋势图表:含数据 → tables,纯图 → figures,语义模糊时优先 tables
    clean_log_examples:
      - "剔除企业宣传标语"
      - "提取碳排放数据表"
      - "统一能源消耗数值单位"
      - "清理年报股东无关信息"

  database:
    description: |
      纯结构化数据库条目(CSMAR / Wind / CNRDS 等)跳过完整 PDF 解析流程。
      仅在附带文本备注 / 描述性内容时,生成 ParsedDoc 主体(blocks 仅含备注)。
      减少无效解析开销。
    extra_info_fields: [db_name, table_name, row_id, fields]
    skip_pdf_parsing: true
    parse_trigger: 仅当条目含文本备注字段时才进入 ParsedDoc 生成
    delete: []
    keep_and_format:
      - 表格入库路径(走 src/collect/structured_db/),不入 ParsedDoc IR
      - 若混有非结构化描述(备注、注释)→ 进 blocks,doc_type=database
    clean_log_examples: []

  # news 暂不做处理,与组员再商议
  # 不在本规范范围内

# ============================================================================
# 输出约束
# ============================================================================
output_constraints:

  structure:
    - 所有清洗后的文本分层存入 blocks / tables / figures,不产生纯无结构大文本
    - heading 严格标记 type + level,正文进 paragraphs

  source_protection:
    - 原始 PDF / HTML 文件不修改
    - source_loc 必须能反推回原始文件

  anomaly_handling:
    - needs_human_review 文档自动分流,不进入 C 批量自动分类

  schema_validation:
    description: |
      所有输出 ParsedDoc 必须通过结构化校验,任一缺失必填字段或非法枚举值
      → meta.global_review_flag = needs_human_review,clean_log 标注 validation_failed
    required_fields:
      - meta.doc_type (合法枚举)
      - meta.doc_type_cn (合法枚举)
      - meta.title
      - meta.source_loc
      - meta.global_review_flag
    enum_constraints:
      - meta.doc_type ∈ {paper, policy, esg_report, database, news}
      - meta.doc_type_cn ∈ 对应中文
      - blocks[].type ∈ {heading, paragraph, list_item, caption}
      - tables[].quality ∈ {ok, table_misaligned}

  boundary_with_C_module:
    - 清洗模块不新增 theme / function 业务标签
    - 主题与功能分类由 C 模块基于 classification_v2.yaml 负责
    - 异常标记 (global_review_flag) 是清洗模块的边界产物,直接触发分流,不进入 C 分类流程
    - 数值标准化输出 (normalized_values) 仅供下游机器运算,blocks 原文保持不变

# ============================================================================
# 与下游模块的接口
# ============================================================================
downstream_interface:

  C_module:
    input: cleaned/<doc_id>.json (ParsedDoc)
    consumes: blocks(按结构切分后做 chunk + 分类)、tables、references
    filter: meta.global_review_flag = ok 的文档进入批量分类

  D_module:
    input: cleaned/<doc_id>.json + C 的 chunks
    consumes: references[]、meta.extra_info.paper.authors / year

  E_module:
    input: D 的检索结果 + 空白库
    consumes: meta.normalized_values(假设可行性判断时的数据查找)