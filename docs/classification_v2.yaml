  level_1:

    绿色金融综述与体系:
      - 总体效率评估
      - 体系架构研究

    绿色金融政策与监管:
      - 试验区政策效果
      - 绿色信贷指引
      - 央行货币政策工具

    绿色信贷:
      - 信贷规模与成本
      - 融资约束缓解机制
      - 高污染行业影响
      - 配置效率

    绿色债券:
      - 发行规模与利差
      - 募集资金使用
      - 绿洗风险
      - 认证债券对比

    企业绿色创新:
      - 绿色专利
      - 节能减排
      - 转型投资

    ESG 披露:
      - 强制披露
      - 评级分歧
      - 信息可信度

    碳市场与碳风险:
      - 碳排放权交易
      - 碳定价
      - 碳风险传染

    S/G 维度:
      - 董事会多样性
      - 利益相关者
      - CSR 表现

  emerging_topics:
    - 转型金融
    - 生物多样性金融
    - 数字金融赋能绿色金融
    - 普惠-绿色融合

function_dimension:
  multi_label_allowed: true
  values:

    研究背景与综述:
      examples:
        - "自 2016 年人民银行发布银发 228 号以来..."
        - "现有研究多聚焦宏观层面,缺乏微观企业..."
        - "关于绿色信贷对融资约束的影响,文献已..."
      rule_keywords:
        synonyms: [现有研究, 本文梳理, 近年来, 回顾相关文献, 已有研究, 前期研究, 国内外学者]
        patterns:
          - 本文在...基础上
          - 现有文献多聚焦
          - 已有较为丰富的研究
          - 鲜有研究
          - 研究尚显不足

    理论机制:
      examples:
        - "基于波特假说,环境规制可能通过..."
        - "基于信号传递理论,ESG 评级..."
        - "现有文献主要依托以下三类机制..."
      rule_keywords:
        synonyms: [机制, 理论分析, 理论框架, 理论推导, 影响路径, 传导机制]
        patterns:
          - 基于...理论
          - 基于...假说
          - 借助...框架
          - 本文从...视角

    研究假设陈述:
      examples:
        - "本文假设 H1:绿色信贷政策..."
        - "基于以上分析,本文提出如下假设:"
      rule_keywords:
        synonyms: [研究假设, 本文假设, 假设提出, 假说设定]
        patterns:
          - 假设 H1
          - 假设 H2
          - 假设一
          - 假设二
          - 基于以上分析,本文提出

    研究方法:
      examples:
        - "本文采用双重差分法,以 2017 年试验区设立为..."
        - "采用倾向得分匹配-双重差分,样本为..."
        - "运用中介效应模型检验..."
      rule_keywords:
        synonyms: [识别策略, 模型设定, 计量方法, 研究方法, 实证设计]
        terms: [双重差分法, 倾向得分匹配, 三重差分法, 工具变量法, 两阶段最小二乘, 广义矩估计, 固定效应, 随机效应, 普通最小二乘, 空间杜宾模型, 空间自回归模型, 空间误差模型, 中介效应模型, 调节效应模型]
        patterns:
          - 采用双重差分
          - 采用多期双重差分
          - 采用倾向得分匹配
          - 采用中介效应
          - 采用空间杜宾
          - 采用工具变量
          - 采用事件研究
          - 采用面板回归

    实证结果:
      examples:
        - "回归结果显示 X 显著为正..."
        - "稳健性检验后结论不变..."
        - "异质性分析表明,国有企业..."
      rule_keywords:
        synonyms: [回归结果, 实证结果, 估计系数, 稳健性结果, 异质性结果, 回归系数]
        patterns:
          - 基准回归
          - 稳健性检验
          - 安慰剂检验
          - 内生性检验
          - 异质性分析
          - 显著为正
          - 显著为负
          - 在 1% 水平上显著
          - 在 5% 水平上显著
          - 在 10% 水平上显著

    数据与变量:
      examples:
        - "范围一排放数据来自碳信息披露项目..."
        - "绿色专利数据来自国家知识产权局..."
        - "财务数据来自国泰安数据库..."
      rule_keywords:
        synonyms: [数据来源, 样本选择, 变量定义, 测度方式]
        terms: [国泰安数据库, 中国研究数据服务平台, 万得数据库, 碳信息披露项目, 世界知识产权组织, 温室气体核算体系, 环境社会与治理, 上市公司协会, 巨潮资讯]
        patterns:
          - 数据来自
          - 数据来源于
          - 样本期
          - 样本区间
          - 范围一
          - 范围二
          - 范围三
          - 吨二氧化碳当量

    局限与政策启示:
      examples:
        - "本文局限是缺乏微观企业层面..."
        - "未来研究可结合文本分析区分..."
        - "基于研究结论,本文提出以下政策建议..."
      rule_keywords:
        synonyms: [研究局限, 政策建议, 政策启示, 未来研究方向, 不足之处, 展望]
        patterns:
          - 本文局限
          - 本文存在以下不足
          - 未来研究可
          - 未来研究方向
          - 政策建议如下
          - 基于上述结论,本文建议

  common_combinations:
    - [研究背景与综述, 理论机制]
    - [理论机制, 研究假设陈述]
    - [研究假设陈述, 研究方法]
    - [研究方法, 数据与变量]
    - [实证结果, 研究方法]
    - [局限与政策启示, 实证结果]
    - [研究背景与综述, 局限与政策启示]

classification_execution:

  rule_based:
    - 读取本文件 rule_keywords 进行字符串包含匹配与正则匹配
    - 命中即打标,confidence ≥ 0.85 直接定标
    - 多标签并存:同一 chunk 命中多个 function 关键词 → 同时打多个 function 标签

  llm_fallback:
    trigger:
      - rule_based 命中 0 个标签
      - rule_based 命中但 confidence < 0.85
      - 主题主走 LLM 路径
    process:
      - rule_keywords 全部序列化进 prompt
      - 强制约束:只能从本文件规定标签中输出,不可自创
      - instructor / Pydantic 解析 + 强校验
      - 输出标签不在白名单 → 拒绝重试(最多 3 次)
      - 失败 → 标记 needs_human_review

